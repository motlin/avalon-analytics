repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: check-yaml
            args: ['--allow-multiple-documents']
          - id: check-json
            # TypeScript and devcontainer config files allow comments; package-lock.json is generated.
            exclude: "tsconfig.*\\.json|package-lock\\.json|\\.devcontainer/devcontainer\\.json"
          - id: check-toml
          - id: check-xml
          - id: end-of-file-fixer
            exclude: "(\\.cursor/|worker-configuration\\.d\\.ts)"
          - id: trailing-whitespace
            exclude: "worker-configuration\\.d\\.ts"
          - id: check-added-large-files
            args: ['--maxkb=1000']
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: detect-private-key
          - id: mixed-line-ending
            args: ['--fix=lf']

    - repo: local
      hooks:
          - id: just-fmt
            name: just --fmt
            entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
            language: system
            files: '(?i)(^|/)\.?justfile$|\.just$'
            types: [file]
          - id: oxfmt
            name: oxfmt-next-line
            entry: oxfmt-next-line --no-error-on-unmatched-pattern
            language: system
            exclude: "(package(-lock)?\\.json|worker-configuration\\.d\\.ts)"
            # Show "Finished in Xms on N files" so every run proves formatting happened.
            verbose: true

          - id: eslint
            name: eslint
            entry: pnpm exec eslint --fix
            language: system
            files: \.(js|jsx|ts|tsx|mjs|cjs)$
            types: [file]
            exclude: "worker-configuration\\.d\\.ts"
